<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Time Limit Reached</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main>
    <img class="icon" src="icons/128.png" alt="" width="96" height="96">
    <h1>Time Limit Reached</h1>
    <p class="domain" id="domain"></p>
    <p class="detail">You've reached your Screen Time limit for this website today.</p>
    <div class="actions">
      <button id="close" class="primary">Close Tab</button>
    </div>
    <p class="hint">Change limits in System Settings → Screen Time.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
